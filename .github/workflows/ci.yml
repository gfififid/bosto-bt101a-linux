name: Build and offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libusb-1.0-0-dev libjpeg-dev libdrm-dev python3
      - name: Build and test without tablet hardware
        run: make -j2 test
      - name: Check shell syntax
        run: bash -n run-display.sh fix-pen.sh scripts/*.sh
